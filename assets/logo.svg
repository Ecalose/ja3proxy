<svg width="520" height="180" viewBox="0 0 520 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JA3Proxy logo</title>
  <desc id="desc">JA3Proxy wordmark with a single straight accent line.</desc>

  <defs>
    <linearGradient id="wordAccent" x1="200" y1="30" x2="434" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <g id="wordmark">
    <text x="40" y="83" fill="#0B1728" font-family="JetBrains Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="76" font-weight="720" letter-spacing="0">JA3</text>
    <text x="195" y="83" fill="url(#wordAccent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="720" letter-spacing="0">Proxy</text>

    <path d="M42 118L462 118" stroke="#0F766E" stroke-width="3.3" opacity="0.82" stroke-linecap="round"/>
    <text x="42" y="158" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="500" letter-spacing="0">TLS fingerprint proxy</text>
  </g>
</svg>
